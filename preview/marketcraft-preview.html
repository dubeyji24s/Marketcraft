here they gather, what they care about and what words to use."},{"text":"\\"Big pet store chains\\"","best":false,"result":"Selling to big chains is a different, much harder business. Start with real customers you can meet."}]},"pitch-video-basics":{"setup":"Your 30-second pitch video starts with 8 seconds of your logo slowly spinning. Viewers drop off fast. What do you change?","options":[{"text":"Make the logo spin faster","best":false,"result":"Still no reason to keep watching. People decide in the first couple of seconds."},{"text":"Open with the problem or the product in action, then show the brand","best":true,"result":"Hook first. Showing the product solving a problem grabs attention, and the brand can appear early without being a slow intro."},{"text":"Add more music","best":false,"result":"Music helps mood, but it doesn't fix a slow opening. Many people watch on mute, too."}]},"honest-marketing":{"setup":"A friend offers to post about your bracelet shop if you give them two free bracelets. What's the right way to do it?","options":[{"text":"Let them post as if they bought it themselves","best":false,"result":"A free product is a connection that must be disclosed. Hiding it misleads followers."},{"text":"Ask them to clearly say they got the bracelets free (for example \\"#ad\\" or \\"gifted\\")","best":true,"result":"Right. Clear disclosure keeps it honest and follows endorsement rules, and followers still trust the post."},{"text":"Only gift bracelets to people with no followers","best":false,"result":"Disclosure rules aren't about follower counts. Any material connection should be disclosed."}]},"honest-reviews":{"setup":"You have 3 reviews and want more before a big weekend market. What's the best move?","options":[{"text":"Ask family to write 5-star reviews as if they were customers","best":false,"result":"Fake reviews are banned and easy to spot. They can bring big penalties and destroy trust."},{"text":"Ask every real customer this week, with a one-tap QR code to your review page","best":true,"result":"Honest and effective. Asking everyone (not just happy-looking ones) and making it easy is how real reviews grow."},{"text":"Offer a discount only to people who promise 5 stars","best":false,"result":"Paying for positive-only reviews is not allowed. You can ask for honest reviews, not specific ratings."}]},"disclose-like-a-pro":{"setup":"You're an ambassador making a 15-second video for a brand that gave you free products. Where should the disclosure go?","options":[{"text":"In the 20th hashtag at the bottom of the caption","best":false,"result":"Buried disclosures don't count. People must see it easily."},{"text":"Say it out loud and show it on screen near the start, plus in the caption","best":true,"result":"Say it and show it where people will notice. That's the clear, professional way."},{"text":"Only in your profile bio","best":false,"result":"Each post needs its own clear disclosure; people don't read bios before every video."}]},"google-business-profile":{"setup":"Your bakery's Google listing shows old hours, and two people complained they arrived to a closed shop. What first?","options":[{"text":"Ignore it; regulars know the hours","best":false,"result":"New customers rely on the listing. Wrong hours lose sales and bring angry reviews."},{"text":"Update the hours, add holiday hours and fresh real photos today","best":true,"result":"Accurate hours and real photos build trust and stop wasted trips. Fast, free and high-impact."},{"text":"Buy ads to push the listing higher","best":false,"result":"Ads won't fix wrong information; they'd just send more people to a closed door."}]},"email-list-from-zero":{"setup":"You collected 200 emails at a fair for a raffle. Can you add them all to your newsletter?","options":[{"text":"Yes, they gave you their email","best":false,"result":"They agreed to a raffle, not a newsletter. Emailing without permission hurts trust and can break the rules."},{"text":"Send one message inviting them to join, with a clear \\"Yes, sign me up\\" button","best":true,"result":"Permission first. People who choose to join open more emails and unsubscribe less."},{"text":"Add them and hide the unsubscribe link","best":false,"result":"Commercial emails must offer a clear way to unsubscribe. Hiding it is a fast way to lose customers."}]},"social-media-that-sells":{"setup":"You have 30 minutes a day for social media. What's the smartest plan?","options":[{"text":"Post on five platforms every day","best":false,"result":"Spread too thin, each account gets weak posts and no time for replies."},{"text":"Choose the one platform your customers use most, post well, and reply to everyone","best":true,"result":"One platform done well beats five done badly, and replies turn followers into customers."},{"text":"Post only \\"buy now\\" ads","best":false,"result":"People follow for value. Mix showing, teaching and stories, with some selling."}]},"track-what-works":{"setup":"You shared your shop link on a flyer, Instagram and an email. Sales went up. Which channel worked?","options":[{"text":"Guess Instagram, because it got the most likes","best":false,"result":"Likes aren't sales. Without tracking, you're guessing."},{"text":"Next time give each channel its own tagged link (UTM) or code and compare","best":true,"result":"Tagged links show exactly where buyers came from, so you can do more of what works."},{"text":"Stop all three to be safe","best":false,"result":"You'd lose the channel that was working. Measure first, then decide."}]},"one-page-marketing-plan":{"setup":"Your goal is \\"get more customers\\". What makes it a strong plan goal?","options":[{"text":"Keep it as is; it's motivating","best":false,"result":"Too vague to plan or measure. When is it done?"},{"text":"\\"Get 40 new customers by 31 March, mainly through the school fair and flyers\\"","best":true,"result":"Specific, dated and tied to channels. Now you can plan tasks and check progress."},{"text":"\\"Become famous\\"","best":false,"result":"Fun, but not measurable or useful for choosing what to do this week."}]},"partner-up":{"setup":"You sell handmade bookmarks. Which partner is the best fit?","options":[{"text":"Another bookmark seller","best":false,"result":"Same product, same customers: that's a competitor, not a partner."},{"text":"The local bookshop or library café","best":true,"result":"Same customers, different products. You can swap flyers, bundle offers or host a reading event together."},{"text":"A car repair shop","best":false,"result":"Very different customers, so a partnership wouldn't reach the right people."}]},"pricing-for-profit":{"setup":"Your candles cost $6 each to make, plus $200 a month in fixed costs. A competitor sells similar candles for $8. What do you do?","options":[{"text":"Price at $7 to beat them","best":false,"result":"You'd make $1 per candle and need 200 sales a month just to break even. Very risky."},{"text":"Price around $16, and explain what makes yours better (scent, handmade, gift-ready)","best":true,"result":"At $16 you earn $10 per candle and break even at 20 sales. Value pricing plus a clear reason to choose you."},{"text":"Copy their $8 price","best":false,"result":"You'd earn $2 per candle and need 100 sales just to cover costs, with no reason for customers to pick you."}]},"keep-your-customers":{"setup":"A regular customer hasn't ordered in 3 months. What's the best small step?","options":[{"text":"Do nothing; they'll come back if they want","best":false,"result":"Many customers drift away simply because they forget. A small nudge often wins them back."},{"text":"Send a short personal note: \\"We miss you! Here's what's new this season\\"","best":true,"result":"Personal touches build loyalty, and winning back a past customer is usually easier than finding a new one."},{"text":"Email them daily discounts until they buy","best":false,"result":"Too pushy. You risk an unsubscribe and teach them to wait for discounts."}]},"seo-basics":{"setup":"Your website title is \\"Home\\". You sell custom cakes in Springfield. What's a better page title?","options":[{"text":"\\"Welcome!!!\\"","best":false,"result":"Says nothing about what you sell or where. Search engines and people can't tell what the page is about."},{"text":"\\"Custom Birthday Cakes in Springfield | Sweet Layers Bakery\\"","best":true,"result":"It uses the words customers actually search for, plus the place and your name. Clear for people and for Google."},{"text":"\\"cakes cakes cakes best cakes cheap cakes\\"","best":false,"result":"Keyword stuffing reads badly and can hurt you. Write for people first."}]},"video-abcd":{"setup":"Your product video shows the brand name only in the last second. What does the ABCD framework suggest?","options":[{"text":"Keep it; a surprise ending is fun","best":false,"result":"Many viewers leave before the end, so they never learn who made it."},{"text":"Show and say the brand early, naturally, while grabbing attention","best":true,"result":"Branding early (without a boring intro) helps viewers remember who the video is from."},{"text":"Put the logo in every single frame, huge","best":false,"result":"Overdoing it feels like a hard sell. Early, natural branding works better."}]},"first-ad-budget":{"setup":"You have $50 for your first online ad. What's the smartest first step?","options":[{"text":"Spend it all in one day for maximum reach","best":false,"result":"You'd learn little and could waste it all on an offer nobody wants."},{"text":"First check that people want your offer (free posts, friends, a market), then run a small test with one clear goal","best":true,"result":"Prove the offer for free first. Then a small, focused test teaches you the most per dollar."},{"text":"Target everyone in the country","best":false,"result":"Too broad for a tiny budget. Narrow, relevant audiences give better results."}]},"truth-in-advertising":{"setup":"Your new energy drink ad says \\"Doctors recommend it!\\" You asked one doctor friend, who said \\"seems fine\\". Can you use the claim?","options":[{"text":"Yes, a doctor did say something nice","best":false,"result":"One casual comment isn't evidence that \\"doctors recommend\\" it. That claim is misleading."},{"text":"No. Remove it and use claims you can prove, like your real ingredients","best":true,"result":"Ads must be truthful and backed by evidence before you publish them. Stick to facts you can show."},{"text":"Yes, if you add tiny small print","best":false,"result":"Small print can't fix a misleading main claim."}]},"accessible-marketing":{"setup":"Your flyer image shows \\"SALE: 30% OFF ALL SCARVES\\" as text inside a photo on your website. What should you add?","options":[{"text":"Nothing; the picture says it all","best":false,"result":"People using screen readers can't read text inside images, so they'd miss your sale."},{"text":"Alt text with the key message, e.g. \\"Sale: 30% off all scarves this weekend\\"","best":true,"result":"Concise alt text shares the message with everyone, and it can help search engines understand the image too."},{"text":"Alt text \\"image123.jpg\\"","best":false,"result":"A file name doesn't help anyone. Describe what matters."}]},"marketing-and-kids-privacy":{"setup":"You run a kids' craft class and want to post a video of the students on your page. What first?","options":[{"text":"Post it; it's a cute video","best":false,"result":"A child's image and voice are personal information. You need a parent's permission first."},{"text":"Get each parent's clear permission first, and leave out names and school details","best":true,"result":"Parental consent first, and share as little personal info as possible. That protects the kids and your business."},{"text":"Blur only the teacher","best":false,"result":"The children are the ones whose privacy needs protecting."}]},"brand-identity":{"setup":"Your lemonade stand's posters use a different colour and font every week. Customers don't recognise them. Fix?","options":[{"text":"Keep changing; variety is exciting","best":false,"result":"Inconsistency makes you forgettable. People recognise brands through repetition."},{"text":"Pick one main colour, one font and a simple logo, and use them everywhere","best":true,"result":"Consistency builds recognition. Save the colour codes so every poster, sign and post matches."},{"text":"Add more colours so it stands out","best":false,"result":"More colours make it harder to remember and more expensive to print."}]},"story-that-sells":{"setup":"Which opening line works best for your scarf shop's story post?","options":[{"text":"\\"We are the best scarf company in the world.\\"","best":false,"result":"A boast, not a story, and not provable. Customers tune out."},{"text":"\\"Last winter my grandma's hands got too cold to knit, so I learned, and now I make scarves for people like her.\\"","best":true,"result":"True, specific and emotional. A real moment makes people care and remember."},{"text":"\\"Scarves: 100% wool, 180 cm, 5 colours.\\"","best":false,"result":"Useful details, but facts alone rarely make people feel anything. Save them for the product page."}]},"market-research-free":{"setup":"You want to open a smoothie stall near school. What's the best free research first?","options":[{"text":"Assume everyone loves smoothies","best":false,"result":"Assumptions are risky. A little research saves money and time."},{"text":"Count foot traffic at different times, check nearby competitors, and ask 10 students 3 short questions","best":true,"result":"Street research plus a quick competitor check tells you who will buy, when, and how to be different."},{"text":"Buy an expensive industry report","best":false,"result":"Not needed at this stage. Free data and real conversations go a long way."}]},"customer-journey":{"setup":"Lots of people visit your online shop, but almost nobody buys. Where's the problem most likely to be?","options":[{"text":"Awareness: you need more visitors","best":false,"result":"People are already arriving. More visitors would just mean more people leaving."},{"text":"Decision: something stops them buying (unclear price, hard checkout, no reviews)","best":true,"result":"Fix the leakiest stage first. Make buying easy and reassuring before spending on more traffic."},{"text":"Loyalty: you need a rewards card","best":false,"result":"Loyalty matters after the first purchase. The leak is earlier."}]},"words-that-get-read":{"setup":"Pick the best first line for your bakery's product page.","options":[{"text":"\\"Welcome to our page! We started baking in 2019 and love what we do…\\"","best":false,"result":"Readers scan. Starting with background buries the benefit they came for."},{"text":"\\"Fresh cookies delivered to your door in 30 minutes.\\"","best":true,"result":"Most important thing first, clear and specific. Scanners get it instantly."},{"text":"\\"Amazing!!! The BEST cookies EVER!!!\\"","best":false,"result":"Hype words make people trust you less. Specific facts persuade better."}]},"call-to-action":{"setup":"Your ad says \\"Free sample this Saturday!\\" Where should the link take people?","options":[{"text":"Your home page","best":false,"result":"People have to hunt for the offer, and many give up."},{"text":"A page with the free-sample sign-up front and centre","best":true,"result":"The landing page keeps the ad's promise. Less effort means more sign-ups."},{"text":"Your \\"About us\\" story","best":false,"result":"Nice to read later, but it doesn't deliver what the ad promised."}]},"phone-product-photos":{"setup":"You're photographing your handmade mug for your shop's main photo. Which setup?","options":[{"text":"Night-time, phone flash, on a busy patterned tablecloth","best":false,"result":"Flash makes harsh shine and the pattern distracts from the mug."},{"text":"Daytime, next to a window, on a plain light background, mug filling most of the frame","best":true,"result":"Soft window light and a clean background make a clear, professional hero shot for free."},{"text":"Add big \\"SALE!\\" text across the photo","best":false,"result":"Text on the main product photo distracts shoppers. Put promotions elsewhere."}]},"content-calendar":{"setup":"It's Sunday night and you have nothing to post this week again. What's the long-term fix?","options":[{"text":"Post whatever you think of each morning","best":false,"result":"That's how posting stops. Last-minute content is stressful and inconsistent."},{"text":"Pick 3 content pillars and batch a month of posts in one afternoon","best":true,"result":"Pillars give you endless ideas and batching saves time, so your feed stays consistent."},{"text":"Only post when you have a sale","best":false,"result":"A feed of only sales gives people little reason to follow."}]},"markets-and-events":{"setup":"At your market stall, people walk past without stopping. What's the quickest fix?","options":[{"text":"Sit and wait; it's early","best":false,"result":"You have about three seconds to catch people as they pass. Waiting won't change that."},{"text":"Add a big readable sign with what you sell and the prices, and raise products to eye level","best":true,"result":"Clear signs and prices remove questions, and height makes products easy to see. Small changes, big difference."},{"text":"Call out to everyone to buy now","best":false,"result":"Pushy calls can scare people off. Make the stall itself inviting."}]},"effortless-service":{"setup":"A customer's order arrived damaged. What builds the most loyalty?","options":[{"text":"Ask them to fill in a 3-page claims form and post the item back first","best":false,"result":"High effort is what makes customers disloyal. Make it easy."},{"text":"Apologise, send a replacement right away, and make it a one-step process","best":true,"result":"Solving it fast with little effort for the customer is what keeps them coming back."},{"text":"Send a surprise gift but take two weeks to fix the problem","best":false,"result":"Extras don't make up for a slow, effortful fix."}]},"bad-reviews":{"setup":"A customer left a 2-star review: \\"Order was late and nobody answered my message.\\" How do you respond?","options":[{"text":"Reply: \\"That's not true, you're lying.\\"","best":false,"result":"Arguing in public makes every future customer nervous. It never \\"wins\\"."},{"text":"Thank them, apologise, explain what you've fixed, and invite them to message you directly","best":true,"result":"Calm and helpful. Future customers see you care, and the reviewer may update their review."},{"text":"Threaten legal action unless they delete it","best":false,"result":"Using threats to remove honest reviews is banned under U.S. consumer review rules."}]},"honest-green-claims":{"setup":"Your soap comes in a box made from 70% recycled cardboard. Which label is best?","options":[{"text":"\\"100% eco-friendly!\\"","best":false,"result":"Vague and impossible to prove. Broad green claims are risky."},{"text":"\\"Box made from 70% recycled cardboard\\"","best":true,"result":"Specific and provable. Customers trust exact facts more than vague promises."},{"text":"\\"Saves the planet\\"","best":false,"result":"A huge, unprovable claim. Stick to what you can show."}]},"selling-online-promises":{"setup":"A supplier delay means you can't ship orders on the date you promised. What do you do?","options":[{"text":"Say nothing and ship late","best":false,"result":"Customers feel ignored, and you must offer a choice when you can't ship on time."},{"text":"Tell customers right away, give a new date, and offer them a choice to wait or cancel for a refund","best":true,"result":"Honest and fair. Most customers appreciate being kept informed, and it follows the shipping rules."},{"text":"Send a different product instead without asking","best":false,"result":"Swapping in something different needs the customer's agreement first."}]},"protect-your-business":{"setup":"You get a message: \\"Your shop account will be deleted in 24 hours! Log in here to verify.\\" What do you do?","options":[{"text":"Click the link and log in quickly","best":false,"result":"Urgent threats with a link are a classic phishing trick to steal your password."},{"text":"Ignore the link, open the app or type the website yourself to check, and turn on two-step login","best":true,"result":"Going to the real site yourself keeps you safe, and two-step login protects you even if a password leaks."},{"text":"Reply with your password so they can check","best":false,"result":"Real platforms never ask for your password by message."}]},"launch-plan":{"setup":"Your new hoodie design is ready. When should you start telling people?","options":[{"text":"On launch day, so it's a surprise","best":false,"result":"Nobody is waiting for it, so launch day is quiet."},{"text":"2–4 weeks before: share sneak peeks, build a waiting list, and email the list first on launch day","best":true,"result":"Warming people up means a crowd is ready to buy the moment you launch."},{"text":"After it sells out","best":false,"result":"Hard to sell out if nobody knows it exists."}]},"test-and-improve":{"setup":"You tried two flyers. Flyer A: 3 sign-ups. Flyer B: 5 sign-ups. Each was seen by about 40 people. What can you conclude?","options":[{"text":"B is definitely better; use it forever","best":false,"result":"With numbers this small, the difference could easily be luck."},{"text":"It might be luck. Keep testing until each has many more responses before deciding","best":true,"result":"Small samples fool people. Wait for enough results, and change only one thing between A and B."},{"text":"Both flyers failed; stop flyers","best":false,"result":"You don't have enough data to judge either way yet."}]}}`),lessons:[{slug:`word-of-mouth`,title:`Word of Mouth: Your Free Megaphone`,summary:`Happy customers are the cheapest advertising you will ever get. Learn how to make your product easy and fun to talk about, then give people a reason to share it.`,level:`beginner`,estimatedMinutes:6,costLevel:`free`,audiences:[`kid`,`adult`,`professional`],sections:[{heading:`Why people share`,body:`People pass along things that make them look helpful, smart, or in-the-know. If your product solves a small annoying problem, or feels like a secret find, customers will want to tell friends about it. Your job is to make that story short enough to repeat in one breath.`,sourceRefs:[0]},{heading:`Make it easy to talk about`,body:`- Pick one memorable thing (the "only" or "first" about you).
- Give it a name people can say out loud.
- Hand out something tangible: a sticker, a card, a sample to share.`,sourceRefs:[0]},{heading:`Ask, and say thank you`,body:`Most happy customers never think to recommend you until you ask. At the moment someone smiles about your product, ask: "Know anyone else who would like this?" Then thank them publicly or with a small perk. If you reward reviews or referrals, tell people clearly that the reviewer got something in return; honesty keeps trust high and follows advertising rules.`,sourceRefs:[1]}],keyTakeaways:[`Referrals cost almost nothing`,`One memorable hook beats ten features`,`Ask at the happiest moment`,`Disclose any rewards for reviews`],actionSteps:[`Write your one-breath description`,`Make 20 referral cards`,`Ask your next 5 customers for a referral`],quiz:[{question:`When is the best time to ask for a referral?`,options:[`Before they buy`,`Right when they are happy with the product`,`A year later`],answerIndex:1},{question:`If you give someone a free gift for a review, you should…`,options:[`Keep it secret`,`Clearly disclose it`,`Only give gifts to family`],answerIndex:1}],sources:[{url:`https://www.sba.gov/business-guide/manage-your-business/marketing-sales`,title:`U.S. Small Business Administration — Marketing and sales`},{url:`https://www.ftc.gov/business-guidance/advertising-marketing/endorsements-influencers-reviews`,title:`FTC — Endorsements, Influencers, and Reviews`}]},{slug:`know-your-customer`,title:`Find Your First 100 Fans`,summary:`Marketing to "everyone" is marketing to no one. Learn to describe one specific customer and go where they already hang out.`,level:`beginner`,estimatedMinutes:7,costLevel:`free`,audiences:[`kid`,`adult`,`professional`],sections:[{heading:`Draw your customer`,body:`Picture one real person who would love your product. How old are they? What do they do on a Saturday? What bugs them that your product fixes? Write it down as a short character sketch and give them a name. Every flyer, post, and video should speak to that one person.`,sourceRefs:[0]},{heading:`Go where they already are`,body:`Instead of paying to bring people to you, show up where your customer already spends time: a school club, a community board, a local online group, a weekend market. List three places, then pick the one you can reach this week for free.`,sourceRefs:[0,1]},{heading:`Test, listen, adjust`,body:`Try a message, see who responds, and ask a few buyers why they bought. Their words are your best marketing copy next time.`,sourceRefs:[1]}],keyTakeaways:[`Describe one specific customer`,`Meet customers where they already gather`,`Use buyers' own words in your ads`],actionSteps:[`Write a 5-line customer sketch`,`List 3 places they gather`,`Ask 3 buyers why they bought`],quiz:[{question:`Who should your marketing speak to?`,options:[`Everyone`,`One specific type of customer`,`Only your friends`],answerIndex:1}],sources:[{url:`https://www.sba.gov/business-guide/plan-your-business/market-research-competitive-analysis`,title:`U.S. Small Business Administration — Market research and competitive analysis`},{url:`https://www.score.org/`,title:`SCORE — Free small business mentoring and resources`}]},{slug:`pitch-video-basics`,title:`The 30-Second Pitch Video Formula`,summary:`A great short video has four beats: hook, problem, solution, call to action. Here is how to film one with just a phone.`,level:`beginner`,estimatedMinutes:8,costLevel:`free`,audiences:[`kid`,`adult`,`professional`],sections:[{heading:`Hook in 3 seconds`,body:`Open with motion, a surprising question, or the product in action. If the first moment is a logo or "Hi, my name is…", viewers scroll away.`,sourceRefs:[0]},{heading:`Problem → Solution → Proof`,body:`Name the annoying problem your customer has, show your product solving it on camera, then add proof: a happy customer, a before/after, or a number.`,sourceRefs:[0]},{heading:`Phone filming checklist`,body:`- Face a window for free, soft light.
- Hold the phone vertically for social, horizontally for screens.
- Get close: the product should fill the frame.
- Add captions; many people watch with the sound off.
- End with ONE clear action: "Visit us Saturday", "DM to order".`,sourceRefs:[0]}],keyTakeaways:[`Hook fast`,`Show, don't tell`,`Captions on`,`One call to action`],actionSteps:[`Write your four beats on a sticky note`,`Film three takes`,`Pick the best and add captions`],quiz:[{question:`What should the first 3 seconds show?`,options:[`Your logo`,`Something that grabs attention`,`A long introduction`],answerIndex:1}],sources:[{url:`https://www.thinkwithgoogle.com/`,title:`Think with Google — marketing insights`}]},{slug:`honest-marketing`,title:`Honest Marketing & the Rules`,summary:`Low-cost marketing still has rules. Learn the basics of truthful claims, disclosing paid endorsements, and respecting people's inboxes.`,level:`intermediate`,estimatedMinutes:6,costLevel:`free`,audiences:[`adult`,`professional`,`kid`],sections:[{heading:`Claims must be true`,body:`If you say "best", "fastest", or "100% natural", be ready to back it up. Specific, honest claims ("baked this morning") build more trust than big vague ones.`,sourceRefs:[0]},{heading:`Disclose relationships`,body:`If a friend, influencer, or customer got free product or money to talk about you, that connection should be clear to viewers, in plain words, right where people will see it.`,sourceRefs:[0]},{heading:`Email with permission`,body:`Only email people who asked to hear from you, include your business contact info, and make unsubscribing easy.`,sourceRefs:[1]}],keyTakeaways:[`Be specific and truthful`,`Disclose paid or gifted endorsements`,`Get permission before emailing`],actionSteps:[`Review your claims for proof`,`Add a disclosure line template`,`Add an unsubscribe link to emails`],quiz:[{question:`An influencer got your product for free. What should their post include?`,options:[`Nothing extra`,`A clear disclosure`,`A discount code only`],answerIndex:1}],sources:[{url:`https://www.ftc.gov/business-guidance/advertising-marketing/endorsements-influencers-reviews`,title:`FTC — Endorsements, Influencers, and Reviews`},{url:`https://www.ftc.gov/business-guidance/resources/can-spam-act-compliance-guide-business`,title:`FTC — CAN-SPAM Act: A Compliance Guide for Business`}]},{slug:`honest-reviews`,title:`Honest Reviews That Bring Customers`,summary:`Reviews are often the last thing people check before buying. Learn how to collect real ones, respond like a pro, and stay on the right side of the FTC rule against fake reviews.`,level:`beginner`,estimatedMinutes:7,costLevel:`free`,audiences:[`kid`,`adult`,`professional`],sections:[{heading:`Why reviews matter so much`,body:`A stranger trusts other customers more than they trust you. A handful of genuine reviews, even a few with small complaints, makes a new business feel safe to try. Your job is to make leaving a review easy for the people who already liked what you sell.`,sourceRefs:[2]},{heading:`How to ask (the right way)`,body:`- Ask every customer, not only the ones you think will be happy.
- Ask soon after a good experience, while it is fresh.
- Make it one tap: a short link or QR code on the receipt, bag or thank-you message.
- Never offer a reward only for positive reviews. You may thank people for leaving a review, but not for leaving a *good* one.`,sourceRefs:[0,1]},{heading:`What the FTC rule bans`,body:`Since October 21, 2024, a U.S. federal rule bans buying or selling fake reviews and testimonials, including AI-written ones from people who never used the product. It also bans paying for reviews that must be positive (or negative), buying fake followers or views, and threatening people to remove bad reviews. Breaking it can mean serious fines.`,sourceRefs:[0,1]},{heading:`Answer every review`,body:`Thank happy customers by name. For a complaint, stay calm, apologize for the experience, and offer to fix it offline. Future customers read your replies too; a kind, helpful answer to a bad review can win more trust than a five-star one.`,sourceRefs:[2]}],keyTakeaways:[`Ask every customer, make it one tap`,`Never pay for positive-only reviews`,`Fake reviews and fake followers are banned`,`Reply to good and bad reviews kindly`],actionSteps:[`Make a short review link or QR code`,`Add it to receipts or thank-you messages`,`Reply to every review this week`],quiz:[{question:`Which of these is allowed?`,options:[`Paying for 5-star reviews only`,`Thanking everyone who leaves any honest review`,`Buying followers to look popular`],answerIndex:1},{question:`How should you handle a negative review?`,options:[`Ignore it`,`Threaten the reviewer`,`Reply politely and offer to fix the problem`],answerIndex:2}],sources:[{url:`https://www.ftc.gov/news-events/news/press-releases/2024/08/federal-trade-commission-announces-final-rule-banning-fake-reviews-testimonials`,title:`FTC — Final Rule Banning Fake Reviews and Testimonials (2024)`},{url:`https://www.ftc.gov/business-guidance/resources/consumer-reviews-testimonials-rule-questions-answers`,title:`FTC — Consumer Reviews and Testimonials Rule: Questions and Answers`},{url:`https://support.google.com/business/answer/7039811`,title:`Google Business Profile Help — Get started`}]},{slug:`disclose-like-a-pro`,title:`Disclose Like a Pro: Ambassador & Influencer Rules`,summary:`If a brand gives you anything (money, free stuff, a discount, or you are its ambassador), your audience deserves to know. Here is exactly when, where and how to say it.`,level:`beginner`,estimatedMinutes:6,costLevel:`free`,audiences:[`kid`,`adult`,`professional`],sections:[{heading:`When you must disclose`,body:`Disclose any connection that could change how people see your recommendation: being paid, getting free or discounted products, being a brand ambassador, working for the company, or being a friend or relative of the owner. A free product counts even if nobody asked you to post about it.`,sourceRefs:[0,1]},{heading:`Where to put it`,body:`- In the post itself, where people will see it without clicking "more".
- Not hidden in a pile of hashtags, a bio or a profile page.
- In a video, say it out loud **and** show it on screen, not only in the description.
- In a live stream, repeat it from time to time for people who join late.
- On **every** post, because followers don't read them all.`,sourceRefs:[0,2]},{heading:`What to say`,body:`Use simple words anyone understands: "#ad", "Sponsored", "I'm a brand ambassador for this brand", or "Thanks to the company for the free sample". Vague tags like "#sp" or "#collab" are not enough.`,sourceRefs:[0]},{heading:`Stay honest`,body:`Only talk about products you have actually tried, share your real opinion, and never make claims you can't prove (like health or money results). Honest ambassadors keep their audience's trust and keep the brand out of trouble.`,sourceRefs:[0,2]}],keyTakeaways:[`Free products count as a connection`,`Disclose in every post, where it's seen`,`Say it AND show it in videos`,`Use clear words like #ad or "brand ambassador"`],actionSteps:[`Write your standard disclosure line`,`Add it to your post and video templates`,`Check old posts and add missing disclosures`],quiz:[{question:`A brand sent you a free product. Do you need to disclose it?`,options:[`No, it was free`,`Yes, free products count`,`Only if you were paid money`],answerIndex:1},{question:`Which disclosure is clearest?`,options:[`#sp`,`#collab`,`"I'm a brand ambassador for this company"`],answerIndex:2},{question:`Where should a video disclosure go?`,options:[`Only in the description`,`Said and shown in the video itself`,`In your bio`],answerIndex:1}],sources:[{url:`https://www.ftc.gov/business-guidance/resources/disclosures-101-social-media-influencers`,title:`FTC — Disclosures 101 for Social Media Influencers`},{url:`https://www.ftc.gov/business-guidance/resources/ftcs-endorsement-guides-what-people-are-asking`,title:`FTC — Endorsement Guides: What People Are Asking`},{url:`https://www.ftc.gov/news-events/topics/truth-advertising/advertisement-endorsements`,title:`FTC — Advertisement Endorsements`}]},{slug:`google-business-profile`,title:`Get Found on Google Maps (for Free)`,summary:`A free Google Business Profile puts a local business on Search and Maps. Learn what to fill in, which photos to add and how to turn views into visits.`,level:`beginner`,estimatedMinutes:7,costLevel:`free`,audiences:[`adult`,`professional`],sections:[{heading:`Who can use it`,body:`Google Business Profiles are for businesses that meet customers in person, at a shop or by visiting them (like a plumber or tutor). Online-only businesses aren't eligible, so they should focus on their website and social profiles instead.`,sourceRefs:[0,1]},{heading:`Fill in the basics perfectly`,body:`- Correct name, address or service area, phone, website and hours (update them for holidays!).
- A clear description (under 750 characters) of what you offer and what makes you different, written for customers, not search engines.
- The right category; it decides which searches you show up in.`,sourceRefs:[1,2]},{heading:`Photos and posts`,body:`Add real photos: the outside of your shop (so people recognize it), the inside, your products and your team. Use Posts to share offers, events and news, each with one clear button like "Book", "Order" or "Call".`,sourceRefs:[1,3]},{heading:`Learn from your numbers`,body:`The profile shows how people found you (which words they searched) and what they did: calls, direction requests, website clicks. Check it monthly, then use those search words in your description and posts.`,sourceRefs:[0]}],keyTakeaways:[`Free listing on Search and Maps`,`For businesses that meet customers in person`,`Accurate hours and real photos build trust`,`Use Posts with one clear call to action`],actionSteps:[`Claim or create your profile`,`Add 5 real photos including the storefront`,`Publish one Post with a clear button`],quiz:[{question:`Which business can NOT get a Google Business Profile?`,options:[`A bakery with a shop`,`A mobile dog groomer`,`An online-only app with no in-person contact`],answerIndex:2},{question:`Why add an outside photo of your shop?`,options:[`It helps people recognize it when they arrive`,`Google requires 50 photos`,`It hides your address`],answerIndex:0}],sources:[{url:`https://business.google.com/us/business-profile/`,title:`Google — Business Profile`},{url:`https://support.google.com/business/answer/7039811`,title:`Google Business Profile Help — Get started`},{url:`https://support.google.com/business/answer/3039617`,title:`Google Business Profile Help — Edit your Business Profile`},{url:`https://support.google.com/business/community-guide/411855960/google-business-profile-posts-best-practices?hl=en`,title:`Google Business Profile Community — Posts best practices`}]},{slug:`email-list-from-zero`,title:`Build an Email List From Zero`,summary:`Social apps can change their rules overnight, but an email list is yours. Learn how to grow one with permission, write emails people open, and follow the CAN-SPAM rules.`,level:`intermediate`,estimatedMinutes:8,costLevel:`free`,audiences:[`adult`,`professional`],sections:[{heading:`Why email still wins`,body:`Followers on social media see only some of your posts, and you don't control the platform. People on your email list chose to hear from you, and you can reach them directly when you have a new product, event or offer.`,sourceRefs:[0]},{heading:`Grow it with permission`,body:`- Offer something useful for signing up: a tip sheet, early access, or a small first-order perk.
- Collect sign-ups everywhere you already are: checkout, events, your website, a QR code on your table.
- Only add people who said yes. Never buy lists or add contacts without asking.`,sourceRefs:[0,1]},{heading:`Emails people actually open`,body:`Write a short, specific subject line, one main message, and one button. Test one change at a time (two subject lines, or two send times) and compare how many people open and click. Keep what works.`,sourceRefs:[0]},{heading:`The rules (CAN-SPAM)`,body:`In the U.S., commercial emails must not use misleading subject lines or sender names, must include your business's physical address, and must give an easy way to unsubscribe, which you honor quickly.`,sourceRefs:[1]}],keyTakeaways:[`Your list is an audience you own`,`Grow only with permission`,`One message, one button per email`,`Honest subject, address and unsubscribe link`],actionSteps:[`Pick a sign-up perk`,`Put a sign-up QR code where customers pay`,`Send your first short email and check opens/clicks`],quiz:[{question:`What is the best way to grow an email list?`,options:[`Buy a list of emails`,`Ask people to opt in with a useful perk`,`Add everyone you have ever met`],answerIndex:1},{question:`Which must every marketing email include?`,options:[`An easy way to unsubscribe`,`At least 5 images`,`A countdown timer`],answerIndex:0}],sources:[{url:`https://www.sba.gov/blog/email-marketing-basics-small-business`,title:`U.S. Small Business Administration — Email marketing basics`},{url:`https://www.ftc.gov/business-guidance/resources/can-spam-act-compliance-guide-business`,title:`FTC — CAN-SPAM Act: A Compliance Guide for Business`}]},{slug:`social-media-that-sells`,title:`Social Media That Sells (Without Paying for Ads)`,summary:`You don't need to be on every app. Pick one platform, post consistently, talk with people, and use social media to test ideas for free.`,level:`beginner`,estimatedMinutes:7,costLevel:`free`,audiences:[`kid`,`adult`,`professional`],sections:[{heading:`Pick one platform first`,body:`Go where your customers already spend time. Teens and creators lean toward short video, local families often use community groups, and professionals use LinkedIn. Doing one platform well beats doing five badly.`,sourceRefs:[0,1]},{heading:`A simple posting mix`,body:`- **Show**: the product in action or how it's made.
- **Teach**: a quick tip your customer will find useful.
- **Tell**: a real story, such as a happy customer (with permission) or behind the scenes.
- **Ask**: a question or poll so people reply.
Post on a steady schedule you can keep, like three times a week.`,sourceRefs:[0]},{heading:`Be social, not just loud`,body:`Reply to comments and messages quickly and kindly; social media is also a customer-service desk. Thank people who tag you, and share their posts (with permission).`,sourceRefs:[0,1]},{heading:`Test ideas for free`,body:`Want to try a new product, price or event? Post about it first and see how people react before spending money. Comments, saves and shares tell you what your audience cares about.`,sourceRefs:[1]}],keyTakeaways:[`One platform done well`,`Show, teach, tell, ask`,`Reply to everyone`,`Test ideas with a free post first`],actionSteps:[`Choose your one platform`,`Plan 3 posts for this week using the mix`,`Reply to every comment within a day`],quiz:[{question:`What is the best first step on social media?`,options:[`Join every app at once`,`Pick the one platform your customers use most`,`Only post ads`],answerIndex:1},{question:`Why post a new idea before launching it?`,options:[`To test the reaction for free`,`To confuse competitors`,`Because ads are banned`],answerIndex:0}],sources:[{url:`https://www.sba.gov/blog/5-tips-make-your-small-business-social-media-savvy`,title:`U.S. Small Business Administration — 5 tips to make your small business social media savvy`},{url:`https://www.sba.gov/business-guide/manage-your-business/marketing-sales`,title:`U.S. Small Business Administration — Marketing and sales`}]},{slug:`track-what-works`,title:`Track What Works: Links, UTMs & Simple Numbers`,summary:`If you can't measure it, you can't improve it. Learn to tag your links so you know exactly which post, flyer or ambassador brought each visitor.`,level:`intermediate`,estimatedMinutes:8,costLevel:`free`,audiences:[`adult`,`professional`],sections:[{heading:`What a UTM link is`,body:"A UTM link is a normal link with labels added to the end, like `?utm_source=instagram&utm_medium=social&utm_campaign=spring_sale`. When someone clicks it, website analytics tools (such as Google Analytics) record those labels, so you can see which campaign brought them.",sourceRefs:[0]},{heading:`The three labels to always use`,body:`- **utm_source**: where the click came from (instagram, flyer, newsletter).
- **utm_medium**: the type of channel (social, email, print).
- **utm_campaign**: the name of your campaign (spring_sale).
Optional labels like **utm_content** help you compare two versions, such as two different buttons in the same email.`,sourceRefs:[0]},{heading:`Keep your labels tidy`,body:`Labels are case-sensitive: "Instagram" and "instagram" show up as two different sources. Pick one lowercase spelling for each label, write them down in a shared list, and use a free URL builder so you never make typos.`,sourceRefs:[0,1]},{heading:`Simple numbers to watch`,body:`Follow the path from attention to action: how many people saw it, how many clicked, and how many bought or signed up. If many see but few click, improve the hook. If many click but few buy, improve the page or offer.`,sourceRefs:[2]}],keyTakeaways:[`UTM labels show which campaign worked`,`Always set source, medium and campaign`,`Use consistent lowercase labels`,`Track seen → clicked → bought`],actionSteps:[`Create one tagged link for your next post`,`Start a shared list of your label names`,`Check results after one week`],quiz:[{question:`Which three UTM labels should you always include?`,options:[`source, medium, campaign`,`color, size, price`,`name, email, phone`],answerIndex:0},{question:`Why use lowercase labels consistently?`,options:[`Labels are case-sensitive, so variants split your data`,`Uppercase is not allowed in links`,`It makes links shorter`],answerIndex:0}],sources:[{url:`https://support.google.com/analytics/answer/10917952?hl=en`,title:`Google Analytics Help — Collect campaign data with custom URLs`},{url:`https://ga-dev-tools.google/ga4/campaign-url-builder/`,title:`Google — Campaign URL Builder`},{url:`https://www.sba.gov/business-guide/manage-your-business/marketing-sales`,title:`U.S. Small Business Administration — Marketing and sales`}]},{slug:`one-page-marketing-plan`,title:`Your One-Page Marketing Plan`,summary:`Big companies write 50-page plans. You need one page: a goal, a customer, a message, three channels, a budget and a way to measure. Here is the template.`,level:`intermediate`,estimatedMinutes:9,costLevel:`free`,audiences:[`kid`,`adult`,`professional`],sections:[{heading:`Start with one clear goal`,body:`Make it specific and measurable, with a deadline: "Get 100 email sign-ups by June 30" or "Sell 50 bracelets at the spring fair". A clear goal tells you which ideas are worth your time.`,sourceRefs:[0,1]},{heading:`Customer and message`,body:`Write one sentence about who you are trying to reach, and one sentence about why they should choose you. Everything you create should repeat that message in different ways.`,sourceRefs:[1]},{heading:`Pick three channels and a budget`,body:`- Choose up to three channels you can actually keep up with (for example: Instagram, an email list, and a flyer at the library).
- Write down your budget in money **and** time (2 hours a week counts!).
- Plan what you will post or do each week.`,sourceRefs:[0,1]},{heading:`Measure and adjust`,body:`Decide in advance what number you will check (sign-ups, sales, clicks) and when. Every two weeks, keep what works and drop what doesn't. A plan you update is better than a perfect plan you never look at again.`,sourceRefs:[0]}],keyTakeaways:[`One specific, dated goal`,`One customer, one message`,`Max three channels you can sustain`,`Check numbers every two weeks`],actionSteps:[`Fill in the one-page template`,`Share it with someone for feedback`,`Set a reminder to review it in two weeks`],quiz:[{question:`Which goal is best?`,options:[`Be famous`,`Get 100 email sign-ups by June 30`,`Post a lot`],answerIndex:1},{question:`How many channels should a beginner focus on?`,options:[`As many as possible`,`Up to three they can keep up with`,`None`],answerIndex:1}],sources:[{url:`https://www.sba.gov/business-guide/manage-your-business/marketing-sales`,title:`U.S. Small Business Administration — Marketing and sales`},{url:`https://www.score.org/`,title:`SCORE — Free small business mentoring and resources`}]},{slug:`partner-up`,title:`Partner Up: Grow With Nearby Businesses & Creators`,summary:`Teaming up with a business or creator who serves the same customers (but doesn't compete with you) doubles your reach for free.`,level:`intermediate`,estimatedMinutes:6,costLevel:`free`,audiences:[`kid`,`adult`,`professional`],sections:[{heading:`Find the right partner`,body:`Look for someone with the same customers but a different product: a coffee shop and a bakery, a dog groomer and a pet photographer, a math tutor and a school supply store. List five possible partners near you or in your online community.`,sourceRefs:[0,1]},{heading:`Simple partnership ideas`,body:`- Swap shout-outs or posts.
- Put each other's flyers or cards at the counter.
- Create a joint bundle or giveaway.
- Run a small event together (a workshop, pop-up or contest).
- Cross-referral: "Show this receipt next door for a free extra".`,sourceRefs:[0]},{heading:`Make it fair and clear`,body:`Agree on who does what, how long it runs, and how you will measure success (for example, separate codes or links for each partner). If either partner gets something of value for a recommendation, disclose it in public posts.`,sourceRefs:[0,2]}],keyTakeaways:[`Same customers, different products`,`Swap shout-outs, flyers or bundles`,`Agree on roles and measurement`,`Disclose paid or rewarded recommendations`],actionSteps:[`List 5 possible partners`,`Message one with a simple idea`,`Track the results with a code or link`],quiz:[{question:`Which pair makes a good partnership?`,options:[`Two pizza shops on the same street`,`A bakery and a coffee shop`,`You and your biggest competitor`],answerIndex:1}],sources:[{url:`https://www.sba.gov/business-guide/manage-your-business/marketing-sales`,title:`U.S. Small Business Administration — Marketing and sales`},{url:`https://www.score.org/`,title:`SCORE — Free small business mentoring and resources`},{url:`https://www.ftc.gov/business-guidance/resources/ftcs-endorsement-guides-what-people-are-asking`,title:`FTC — Endorsement Guides: What People Are Asking`}]},{slug:`pricing-for-profit`,title:`Pricing for Profit: Set Prices That Pay You`,summary:`Price is marketing too. It tells customers what your product is worth, and it decides whether your business survives. Learn the three professional pricing methods, how to find your break-even point, and why discounting is riskier than it looks.`,level:`intermediate`,estimatedMinutes:14,costLevel:`free`,audiences:[`kid`,`adult`,`professional`],sections:[{heading:`Why pricing is a marketing decision`,body:`Many new business owners pick a price by guessing, or by copying the cheapest competitor. That's risky. Your price sends a message: a very low price can say "budget" or even "low quality", while a confident price says "this is worth it". Price also decides how many sales you need to make a profit. If your price is too low, you can be busy every day and still lose money. Professional marketers decide on price on purpose, using numbers, and revisit it regularly.`,sourceRefs:[0,1]},{heading:`Method 1: Cost-plus pricing`,body:`Start by adding up everything one unit costs you: materials, packaging, your time, and a share of your fixed costs (rent, tools, website, fees). Then add a markup on top. The key mistake to avoid is counting only materials. If a bracelet's beads cost $3 but you forget the 30 minutes it takes to make it, the bag it goes in and the card-reader fee, your "profit" is an illusion.

- List every cost per unit, including your time.
- Add a share of monthly fixed costs.
- Add a markup that leaves real profit.`,sourceRefs:[1,2]},{heading:`Method 2: Value-based pricing`,body:`Value-based pricing asks a different question: what is this worth to the customer? A handmade gift, a time-saving service or a product with a story can be worth much more than its cost. To find out, ask real people. Short surveys and conversations ("What would you expect to pay for this?") and looking at what similar products sell for give you a realistic range. Value pricing works best when you can clearly explain why yours is different.`,sourceRefs:[2,3]},{heading:`Method 3: Competitive (market) pricing`,body:`Look at what competitors charge, then decide your position on purpose:

- **Premium**: higher price, justified by better quality, service or experience.
- **Market price**: similar to others, competing on convenience or relationship.
- **Discount**: lower price. This is hard for small businesses to sustain, because big companies can usually go lower than you.

Most professionals combine all three methods: cost-plus sets the floor, competitors show the market range, and value tells you how high you can go.`,sourceRefs:[2,3]},{heading:`Know your break-even point`,body:`Your break-even point is the number of sales you need to cover all your costs. The formula is simple: **fixed costs ÷ (price − variable cost per unit)**. For example, if your monthly fixed costs are $200 and each candle costs $6 to make and sells for $16, each sale contributes $10, so you need 20 sales a month just to break even. Sale 21 is your first real profit. Knowing this number makes every marketing decision clearer: you know exactly how many customers each campaign must bring in.`,sourceRefs:[0,4]},{heading:`The hidden danger of discounts`,body:`Discounts feel like easy marketing, but they have costs. Frequent sales can teach customers to wait for the next discount, and they can lower how valuable your product feels. Very low prices can also start a price war you can't win. Better alternatives:

- Add value instead of cutting price (a free gift wrap, a bonus sample).
- Create bundles ("3 for $40") that raise the order size.
- Make limited offers truly limited, and honest.`,sourceRefs:[2,3]},{heading:`Review prices regularly`,body:`Costs change quietly: supplies get more expensive, platform fees rise, your time becomes more valuable. Put a reminder in your calendar every three months to recheck your costs and your break-even point. If you raise prices, explain the value honestly; loyal customers usually understand when you're open with them.`,sourceRefs:[2]}],keyTakeaways:[`Price is part of your marketing message`,`Count every cost, including your time`,`Combine cost-plus, value and competitor pricing`,`Know your break-even number`,`Add value before you cut price`,`Recheck prices every few months`],actionSteps:[`Write down every cost for one product, including your time`,`Calculate your break-even point`,`Ask 5 people what they would expect to pay`,`Decide: premium, market or discount position, and why`],quiz:[{question:`Fixed costs are $200/month, a product costs $6 to make and sells for $16. How many sales to break even?`,options:[`10`,`20`,`33`],answerIndex:1},{question:`Which cost do beginners most often forget?`,options:[`Materials`,`Their own time`,`The product name`],answerIndex:1},{question:`Why are constant discounts risky?`,options:[`They teach customers to wait and lower perceived value`,`They are illegal`,`They always increase profit`],answerIndex:0}],sources:[{url:`https://www.sba.gov/business-guide/manage-your-business/marketing-sales`,title:`U.S. Small Business Administration — Marketing and sales`},{url:`https://ascent.sba.gov/c6/8f/a63aed55494cadad8837b640db33/strategic-marketing-5-3-pricing-strategy-tool.pdf`,title:`SBA Ascent — Pricing strategy tool (PDF)`},{url:`https://www.score.org/resource/pricing-strategies-small-business`,title:`SCORE — Pricing Strategy: Appeal to the Heart, Then the Brain`},{url:`https://www.score.org/southerncolorado/resource/blog-post/pricing-strategy-products-or-services`,title:`SCORE — Pricing Strategy for Products or Services`},{url:`https://www.sba.gov/counseling/plan-your-business/`,title:`U.S. Small Business Administration — Plan your business`}]},{slug:`keep-your-customers`,title:`Keep the Customers You Win: Retention & Loyalty`,summary:`Getting a new customer takes effort and money. Keeping the right customers coming back is often the most profitable marketing there is. Learn how to choose who to keep, build loyalty without big budgets, and win back customers who drifted away.`,level:`intermediate`,estimatedMinutes:13,costLevel:`free`,audiences:[`kid`,`adult`,`professional`],sections:[{heading:`Why retention matters`,body:`Most beginners spend all their energy finding new customers. Professionals also ask: how many of our customers come back? Returning customers already trust you, need less convincing, and often recommend you to friends. Experts at Harvard Business School point out that the right level of customer loss ("churn") depends on your business model. A one-time product works differently from a subscription. But for most small businesses, a loyal group of repeat customers is the steadiest foundation you can build.`,sourceRefs:[0]},{heading:`Keep the RIGHT customers`,body:`Not every customer is a good fit. Some cost more time than they bring in, or want something you don't offer. Professionals decide up front who they serve best: the customers they can genuinely help, and who are valuable to the business. Then they focus their energy, offers and attention on those people. Write a short description of your ideal repeat customer and use it to guide your decisions.`,sourceRefs:[0]},{heading:`The loyalty toolkit (low cost)`,body:`- **Remember people**: use names, remember preferences, send a thank-you note.
- **Make the first experience great**: the first purchase decides if there's a second one.
- **Stay in touch with permission**: an email list or follow, with useful updates (not spam).
- **Simple rewards**: a stamp card ("buy 9, get the 10th free") is cheap and effective.
- **Ask for feedback**: a two-question survey shows you care, and tells you what to fix.
- **Fix problems fast**: a well-handled complaint can create a more loyal customer than no problem at all.`,sourceRefs:[0,2]},{heading:`Measure your repeat rate`,body:`You can't improve what you don't measure. Track two simple numbers every month:

- **Repeat rate**: of last month's customers, how many bought again?
- **Time between purchases**: how long until people come back?

If people usually return after about six weeks, a friendly reminder at week five ("New colours are in!") can bring them back right on time.`,sourceRefs:[0]},{heading:`Win back customers who drifted away`,body:`Customers who left aren't always lost for good. Research published in Harvard Business Review found that customers who came back to a service had a higher average lifetime value the second time ($1,410) than during their first stay ($1,262). The lesson: a respectful "we miss you" message, an honest explanation of what has improved, or an invitation to try something new can be well worth sending. Ask why they left, and fix it if you can.`,sourceRefs:[1]},{heading:`Stay honest and respectful`,body:`Loyalty is built on trust. Only message people who agreed to hear from you, make unsubscribing easy, and never invent fake urgency ("last chance!" when it isn't). If you offer a reward for reviews, follow the rules on honest reviews: reward people for reviewing, never only for positive reviews.`,sourceRefs:[2,3]}],keyTakeaways:[`Returning customers are your most stable growth`,`Decide which customers you serve best`,`Small personal touches build loyalty`,`Track repeat rate and time between purchases`,`Win-back messages can be very valuable`,`Loyalty depends on honesty and permission`],actionSteps:[`Describe your ideal repeat customer`,`Set up a simple stamp card or thank-you note`,`Check how many customers bought twice this month`,`Write a respectful "we miss you" message`],quiz:[{question:`What did HBR research find about returning customers?`,options:[`They are worth nothing`,`Their average lifetime value was higher the second time`,`They always leave again`],answerIndex:1},{question:`Which is a low-cost loyalty idea?`,options:[`A stamp card`,`A billboard`,`Buying followers`],answerIndex:0},{question:`When should you send a reminder to a customer who usually returns every 6 weeks?`,options:[`After 6 months`,`Around week 5`,`Every day`],answerIndex:1}],sources:[{url:`https://hbr.org/2014/10/the-value-of-keeping-the-right-customers`,title:`Harvard Business Review — The Value of Keeping the Right Customers (2014)`},{url:`https://hbr.org/2016/03/winning-back-lost-customers`,title:`Harvard Business Review — Winning Back Lost Customers (2016)`},{url:`https://www.ftc.gov/business-guidance/resources/can-spam-act-compliance-guide-business`,title:`FTC — CAN-SPAM Act: A Compliance Guide for Business`},{url:`https://www.ftc.gov/business-guidance/resources/consumer-reviews-testimonials-rule-questions-answers`,title:`FTC — Consumer Reviews and Testimonials Rule: Q&A`}]},{slug:`seo-basics`,title:`Be Found on Google: SEO Basics That Actually Work`,summary:`Search engine optimization (SEO) is how people find you when they search. There are no secret tricks. Google's own guidance says to make helpful pages for people, describe them clearly, and avoid spam. Here's how to apply that to a small business website.`,level:`intermediate`,estimatedMinutes:15,costLevel:`free`,audiences:[`kid`,`adult`,`professional`],sections:[{heading:`What SEO really is`,body:`When someone types "birthday cakes near me" or "how to choose a wool scarf", Google tries to show the most helpful pages. SEO means making your pages easy for Google to understand and genuinely useful for the people searching. Google publishes an official SEO Starter Guide for anyone who owns or promotes content, and it was refreshed in 2024. Its message is consistent: build for people first. Be wary of anyone promising "guaranteed #1 rankings": Google itself warns about this when hiring an SEO.`,sourceRefs:[0,1,3]},{heading:`Think like your customer: search words`,body:`List the words real customers use, not your internal jargon. A bakery might call it "artisan levain", but customers search for "sourdough bread". Useful ways to find these words:

- Ask customers how they would search for you.
- Type your topic into Google and look at the suggestions.
- Later, Google Search Console shows the exact searches that brought people to your site.`,sourceRefs:[0,4]},{heading:`Make each page clear`,body:`- **Page title**: a short, specific title for each page ("Handmade Wool Scarves in Portland").
- **Headings**: use clear headings that match what the section is about.
- **Readable web addresses**: /wool-scarves is clearer than /page?id=123.
- **Descriptive images**: give images meaningful file names and alt text. This also helps people who use screen readers.
- **One topic per page**: a page about gift boxes should be about gift boxes.`,sourceRefs:[0,5]},{heading:`Write helpful, original content`,body:`Google's guidance repeatedly comes back to helpful, people-first content. For a small business, that means answering the real questions customers ask: How long does delivery take? How do I care for this? Which size should I choose? A short FAQ page, a care guide or a "how to choose" article can bring in searches for months. Write it in your own words, from your own experience. Copying other sites doesn't help you and can hurt you.`,sourceRefs:[0,2]},{heading:`Play by the rules: Search Essentials`,body:`Google's Search Essentials (formerly the Webmaster Guidelines) explains what can get a site demoted or removed. Avoid:

- Stuffing pages with repeated keywords.
- Hidden text or misleading pages.
- Buying links or joining link schemes.
- Copying content from other sites.

The safe strategy is also the effective one: useful pages, honest information, and a site that works well on phones.`,sourceRefs:[2]},{heading:`Measure with Search Console`,body:`Google Search Console is a free tool that shows how your site appears in Google Search: which searches show your pages, how often people click, and any problems Google finds. Check it monthly. If a page appears often but few people click, improve its title. If people search for something you don't cover yet, consider writing a helpful page about it.`,sourceRefs:[4]},{heading:`Local businesses: combine SEO with your Business Profile`,body:`If you meet customers in person, your website and your free Google Business Profile work together. Keep your name, address and hours the same everywhere, link your profile to your website, and collect honest reviews. For local searches, these signals together help people choose you.`,sourceRefs:[6]}],keyTakeaways:[`SEO = helpful pages that are easy to understand`,`Use the words customers actually search`,`Clear titles, headings, addresses and alt text`,`Answer real customer questions`,`Avoid keyword stuffing, hidden text and bought links`,`Measure with free Search Console`],actionSteps:[`List 10 search phrases your customers use`,`Rewrite the title of your most important page`,`Write one helpful FAQ or "how to choose" page`,`Set up Google Search Console`],quiz:[{question:`What does Google's guidance say to focus on?`,options:[`Secret ranking tricks`,`Helpful, people-first content`,`Repeating keywords many times`],answerIndex:1},{question:`Which of these is against Google's Search Essentials?`,options:[`A clear FAQ page`,`Buying links`,`Descriptive image alt text`],answerIndex:1},{question:`Which free tool shows the searches that bring people to your site?`,options:[`Google Search Console`,`A spreadsheet`,`A printer`],answerIndex:0}],sources:[{url:`https://developers.google.com/search/docs`,title:`Google Search Central — Documentation (includes the SEO Starter Guide)`},{url:`https://developers.google.com/search/docs/beginner/get-started`,title:`Google Search Central — Beginner's guide to SEO`},{url:`https://developers.google.com/search/docs/essentials`,title:`Google Search Essentials`},{url:`https://developers.google.com/search/docs/beginner/do-i-need-seo`,title:`Google Search Central — Do you need an SEO?`},{url:`https://developers.google.com/search/docs/monitor-debug/search-console-start`,title:`Google Search Central — How to use Search Console`},{url:`https://www.w3.org/WAI/alt/`,title:`W3C WAI — Resources on alternative text for images`},{url:`https://support.google.com/business/answer/7039811`,title:`Google Business Profile Help — Get started`}]},{slug:`video-abcd`,title:`Video That Works: Google's ABCD Framework`,summary:`Google studied what makes video ads effective on YouTube and summed it up as the ABCDs: Attention, Branding, Connection, Direction. Here's how to use this professional framework for any short marketing video, whether it's an ad, a Reel or your Studio pitch.`,level:`intermediate`,estimatedMinutes:13,costLevel:`free`,audiences:[`kid`,`adult`,`professional`],sections:[{heading:`Why a framework helps`,body:`It's easy to film something that looks nice but doesn't sell. Google's ABCDs come from analysing what works in real YouTube ads, and they give you a checklist for every video you make. Google is clear that they are principles, not a formula. They help you check your ideas, but the creativity is still yours. Use them when you plan, and again before you post.`,sourceRefs:[0,1,3]},{heading:`A is for Attention: win the first seconds`,body:`People decide almost instantly whether to keep watching. Google's playbook recommends grabbing attention early with pacing, tight framing and bold, high-contrast visuals, for example using two or more shots in the first five seconds.

- Open on motion or the product in action, not a logo or "Hi, my name is…"
- Frame close: faces and products should fill the screen.
- Start with a question, a surprise or a result.`,sourceRefs:[1,0]},{heading:`B is for Branding: make it clear who this is`,body:`A great video that nobody remembers you for doesn't help your business. Show your brand early and more than once: the product, the logo, the name. Google's research notes that a brand mentioned out loud by a person on screen tends to work better than a voice-over mention. So say your brand name yourself, naturally, in the video.`,sourceRefs:[1]},{heading:`C is for Connection: make people feel something`,body:`Facts tell; feelings sell. Use humour, surprise, a small story, or real emotion. Show real people using the product. And keep the message focused: one main idea per video. Google's guidance specifically warns against cramming in too much. If you have three messages, make three videos.`,sourceRefs:[2,1]},{heading:`D is for Direction: tell people what to do`,body:`Every video needs a clear call to action: visit, follow, order, sign up. Reinforce it two ways, by saying it out loud and by showing it on screen as text. Make it specific ("Order by Friday for weekend delivery") rather than vague ("Check us out").`,sourceRefs:[1,2]},{heading:`Make versions for each screen`,body:`People watch on phones held upright and on TVs and laptops held sideways. Google's recent guidance says both vertical (9:16) and horizontal (16:9) versions matter. Film with space around your subject so you can crop both, or make two edits. Try variations too: two different openings, then keep the one that performs better.`,sourceRefs:[4,5]},{heading:`ABCD checklist before you post`,body:`- **A**: Does something interesting happen in the first 3–5 seconds?
- **B**: Is the brand shown and said early, and again later?
- **C**: Is there one clear idea, and a human or emotional moment?
- **D**: Is the call to action spoken and shown on screen?
- **Honesty**: If you're an ambassador or were paid, is the disclosure said and shown?`,sourceRefs:[1,6]}],keyTakeaways:[`Attention: hook in the first seconds`,`Branding: show and say your brand early`,`Connection: one focused idea with real emotion`,`Direction: a specific call to action, said and shown`,`Make vertical and horizontal versions`,`Test two openings and keep the winner`],actionSteps:[`Plan your next video with the ABCD checklist`,`Rewrite your opening so something happens in 3 seconds`,`Say your brand name on camera`,`Add an on-screen call to action`],quiz:[{question:`What does the "B" in ABCD stand for?`,options:[`Budget`,`Branding`,`Background`],answerIndex:1},{question:`What does Google's research say about brand mentions?`,options:[`Never mention your brand`,`A person saying it on screen tends to beat a voice-over`,`Only show the logo at the end`],answerIndex:1},{question:`How many main messages should one short video have?`,options:[`One`,`Five`,`As many as possible`],answerIndex:0}],sources:[{url:`https://business.google.com/us/think/future-of-marketing/youtube-video-ad-creative/`,title:`Think with Google — YouTube ABCDs: video ad best practices`},{url:`https://www.thinkwithgoogle.com/_qs/documents/8472/ABCD_Complete_V7b_HR_1.pdf`,title:`Think with Google — ABCD playbook (PDF)`},{url:`https://support.google.com/google-ads/answer/14783551?hl=en`,title:`Google Ads Help — About the ABCDs of effective video ads`},{url:`https://www.thinkwithgoogle.com/_qs/documents/15987/ABCDs_PDFPlaybook_April2022_Final.pdf`,title:`Think with Google — ABCDs storytelling playbook (PDF, 2022)`},{url:`https://business.google.com/en-all/think/future-of-marketing/how-to-improve-youtube-ad-creative-performance/`,title:`Think with Google — Improve your YouTube ads performance`},{url:`https://www.thinkwithgoogle.com/future-of-marketing/creativity/creative-best-practices-youtube-ads/`,title:`Think with Google — 5 creative best practices for YouTube ads`},{url:`https://www.ftc.gov/business-guidance/resources/disclosures-101-social-media-influencers`,title:`FTC — Disclosures 101 for Social Media Influencers`}]},{slug:`first-ad-budget`,title:`Your First Small Ad Budget (Without Wasting It)`,summary:`Paid ads can speed up growth, but only if you control the spend. Learn how ad budgets really work on Google Ads (including why a day can cost double your daily budget), how to start small, and how to decide whether an ad paid for itself.`,level:`advanced`,estimatedMinutes:14,costLevel:`under $200`,audiences:[`adult`,`professional`],sections:[{heading:`Free first, paid second`,body:`Paid ads amplify what already works. They rarely fix a weak offer. Before spending money, make sure your free marketing is working: you know your customer, your message gets a reaction, and your website or shop turns visitors into buyers. Then a small, controlled ad budget can bring more of the right people to something already proven.`,sourceRefs:[0,5]},{heading:`How "average daily budget" really works`,body:`In Google Ads, you set an **average daily budget**: roughly what you're comfortable spending per day, averaged over a month. Two details surprise beginners:

- On a single day, Google may spend **up to about twice** your average daily budget (a $10 budget can spend up to $20 on a busy day).
- Over a month, you won't be charged more than about **30.4 × your daily budget** (about $304 for a $10 budget).

So if you have a monthly amount in mind, divide it by 30.4 to get your daily budget.`,sourceRefs:[1,2]},{heading:`Start small and focused`,body:`With a small budget, focus beats spreading out: splitting a small amount of money across many campaigns means none of them gets enough to learn what works. Start with one campaign:

- One product or offer.
- One clear audience or area (for example, your town).
- One goal: calls, visits, sign-ups or sales.`,sourceRefs:[1,3]},{heading:`Watch automated bidding`,body:`Automated "smart" bidding strategies can be powerful, but read the settings carefully. For example, Google notes that strategies like Maximize conversions try to spend your full average daily budget. So if you set the budget higher than you can truly afford, the system will use it. Always set the budget at an amount you're genuinely comfortable spending, and check spending in the first days.`,sourceRefs:[3,4]},{heading:`Did the ad pay for itself?`,body:`Before launching, decide how you'll judge success. A simple professional check:

- **Cost per customer** = ad spend ÷ new customers from the ad.
- Compare it with the **profit** you make from a customer (see the Pricing for Profit lesson).

If an ad costs $50 and brings 5 customers who each bring $15 profit, you made $75 profit on $50: a win. Use tracked links (UTM tags) so you know which customers came from which ad.`,sourceRefs:[5,6]},{heading:`Honest ads only`,body:`Paid ads must follow the same truth-in-advertising rules as everything else: claims must be true and backed by evidence, and important conditions must be clear, not hidden in fine print. Also follow each ad platform's own policies. Never promise results you can't prove.`,sourceRefs:[7]}],keyTakeaways:[`Prove your offer with free marketing first`,`A day can spend up to ~2× the average daily budget`,`Monthly spend is capped at ~30.4× the daily budget`,`Keep small budgets focused in one campaign`,`Judge ads by cost per customer vs. profit`,`Ads must be truthful and clear`],actionSteps:[`Pick one offer, one audience, one goal`,`Turn your monthly budget into a daily budget (÷ 30.4)`,`Set up tracked links for the ad`,`Check spend and results after 3 days and after 2 weeks`],quiz:[{question:`With a $10 average daily budget, roughly what is the most Google may spend on one busy day?`,options:[`$10`,`About $20`,`$100`],answerIndex:1},{question:`You have $150 for a month. About what daily budget should you set?`,options:[`About $5`,`$150`,`$30`],answerIndex:0},{question:`An ad cost $50 and brought 5 customers with $15 profit each. Was it profitable?`,options:[`Yes: $75 profit vs $50 spend`,`No`,`You can't tell`],answerIndex:0}],sources:[{url:`https://www.sba.gov/business-guide/manage-your-business/marketing-sales`,title:`U.S. Small Business Administration — Marketing and sales`},{url:`https://support.google.com/google-ads/answer/6385083?hl=en`,title:`Google Ads Help — About average daily budgets`},{url:`https://support.google.com/google-ads/answer/6312?hl=en`,title:`Google Ads Help — Average daily budget: definition`},{url:`https://support.google.com/google-ads/answer/10486536?hl=en`,title:`Google Ads Help — Budgets overview`},{url:`https://support.google.com/google-ads/answer/1704424?hl=en`,title:`Google Ads Help — Manage your spend in Google Ads`},{url:`https://support.google.com/google-ads/answer/10486637?hl=en`,title:`Google Ads Help — About spending limits`},{url:`https://support.google.com/analytics/answer/10917952?hl=en`,title:`Google Analytics Help — Collect campaign data with custom URLs`},{url:`https://www.ftc.gov/business-guidance/resources/advertising-faqs-guide-small-business`,title:`FTC — Advertising FAQ's: A Guide for Small Business`}]},{slug:`truth-in-advertising`,title:`Truth in Advertising: Claims You Can Prove`,summary:`Honest marketing isn't just ethical. In the U.S. it's the law. Learn the FTC's core advertising rules in plain words: no misleading claims, evidence before you advertise, clear disclosures, and honest endorsements. Then use them to write confident, trustworthy marketing.`,level:`intermediate`,estimatedMinutes:13,costLevel:`free`,audiences:[`kid`,`adult`,`professional`],sections:[{heading:`The three core rules`,body:`The Federal Trade Commission's guide for small businesses sums up U.S. advertising law in three ideas:

- **Ads must be truthful and not misleading.**
- **You need evidence for your claims before you make them.**
- **Ads can't be unfair.**

These apply to every kind of marketing: social posts, flyers, videos, emails, websites and ads.`,sourceRefs:[0,1]},{heading:`What "misleading" means`,body:`An ad can mislead by what it says or by what it leaves out. The FTC looks at whether a statement, or a missing piece of information, is likely to mislead a reasonable customer about something that matters to their decision. "100% natural" when it isn't, a "sale" price that was never the normal price, or hiding that a "free trial" turns into a paid subscription are all classic examples.`,sourceRefs:[0]},{heading:`Evidence first`,body:`Before you say it, be able to prove it. The FTC calls this having a "reasonable basis": objective evidence that backs up your claim. Simple claims ("handmade in small batches") need simple proof (it's true, and you can show it). Health, safety and performance claims need much stronger, often scientific, evidence. If you can't prove it, rewrite it as something true and specific: "customers say it's the coziest scarf they own" (only if they really did) instead of "the warmest scarf in the world".`,sourceRefs:[0,1]},{heading:`Disclosures must be clear`,body:`If a claim needs extra information to be accurate ("results vary", "while supplies last", "subscription renews monthly"), that information must be clear and easy to notice. Tiny fine print, fast-scrolling text or a note hidden behind a link usually doesn't fix a misleading main message. A good test: would a busy customer see and understand it before deciding?`,sourceRefs:[0,2]},{heading:`Endorsements and reviews`,body:`Testimonials must be real and reflect what customers typically experience. If someone was paid, got a free product, is an employee or a relative, or is a brand ambassador, that connection must be disclosed. And fake reviews (including AI-written ones) are banned under the FTC's 2024 rule.`,sourceRefs:[0,3,4]},{heading:`Write confident AND honest copy`,body:`Honest doesn't mean boring. Strong, truthful copy is specific:

- Instead of "the best bakery", try "bread baked fresh every morning at 6am".
- Instead of "guaranteed results", try "here's what our last 20 customers said".
- Instead of "limited time!!!", give the real end date.
