- Price display or offer`,sourceRefs:[1]},{heading:`Make it fair`,body:`Both versions should get a similar chance: similar time of day, similar audience, similar number of people. Google's testing tools often split traffic 50/50 for this reason. For a market stall, you might use sign A on Saturday morning and sign B the next Saturday morning — not one on a rainy day and one on a sunny day.`,sourceRefs:[1]},{heading:`Wait for enough results`,body:`Small numbers can fool you. If 3 people clicked A and 5 clicked B, that could just be luck. Professional tools wait for a minimum amount of data before showing a result — Google's Demand Gen experiments, for instance, need at least 50 conversions per version when using conversion-based bidding. For small businesses: run tests long enough to get dozens of responses, and be careful about drawing big conclusions from tiny numbers.`,sourceRefs:[1]},{heading:`Measure the right thing`,body:`Choose your measure *before* the test: sales, sign-ups, messages or clicks. "Likes" are nice but don't always mean sales. Write down your guess (the "hypothesis") first: "I think a photo of someone using the product will get more orders than a plain product photo." Then see if you were right.`,sourceRefs:[]},{heading:`Keep a test log`,body:`Keep a simple log: date, what you tested, version A, version B, results, winner and what you learned. Over months this becomes your own playbook of what works for your customers. USDA's experience with a night market found that vendors who adapted to what customers responded to did better — testing is how you find out what customers respond to.`,sourceRefs:[2]}],keyTakeaways:[`A/B tests compare two versions`,`Change only one thing`,`Give both versions a fair chance`,`Wait for enough results`,`Decide what to measure first`,`Keep a test log`],actionSteps:[`Write a hypothesis for one test`,`Make version A and version B in the Design Studio`,`Run the test for at least a week`,`Record results in a test log`],quiz:[{question:`What is the most important A/B test rule?`,options:[`Change everything at once`,`Change only one thing`,`Only test on weekends`],answerIndex:1},{question:`A got 3 clicks, B got 5. What should you conclude?`,options:[`B is definitely better`,`It might be luck — get more results`,`Delete both`],answerIndex:1},{question:`When should you decide what to measure?`,options:[`Before the test`,`After seeing results`,`Never`],answerIndex:0}],sources:[{url:`https://support.google.com/google-ads/answer/10682377?hl=en`,title:`Google Ads Help — About the "Experiments" page`},{url:`https://support.google.com/google-ads/answer/13719071?hl=en`,title:`Google Ads Help — Create A/B experiments for Demand Gen campaigns`},{url:`https://usda.gov/media/blog/2015/12/10/five-lessons-learned-usdas-farmers-market-night`,title:`USDA — Five Lessons Learned from USDA's Farmers Market at Night`}]}],challenges:[{slug:`lemonade-launch`,title:`Launch Weekend Lemonade`,product:`Fresh-squeezed lemonade stand`,brief:`You are opening a lemonade stand this Saturday near a park. Create a 30-60 second pitch video that gets neighbors to come by. Plan a sign, a hook, and a reason to visit today.`,channel:`outdoor`,budget:`$10`,difficulty:`starter`,audiences:[`kid`,`adult`,`professional`],certificateBadge:`Street-Smart Seller`,color:`#FFC83D`},{slug:`handmade-reel`,title:`Handmade Goods Reel`,product:`Handmade beaded bracelets`,brief:`Make a short vertical video for social media that shows how your bracelets are made and why they make a great gift. End with how to order.`,channel:`social`,budget:`$0`,difficulty:`starter`,audiences:[`kid`,`adult`,`professional`],certificateBadge:`Social Spark`,color:`#FF5DA2`},{slug:`bakery-referral`,title:`Neighborhood Bakery Referral Push`,product:`Small-batch sourdough bakery`,brief:`Pitch a referral program ("bring a friend, get a free cookie") in a 60 second video for Instagram and a printed counter card. Explain who you target and how you will measure it.`,c ever see or store your password.`],[`AI processing`,`To give feedback, your written strategy, optional script and a few still frames from your uploaded video are sent to our AI provider (Anthropic) for evaluation. They are not used to publish anything.`],[`Creator AI pictures`,`If you tick "Add a free AI picture" in Creator, your picture description (not your name or account) is sent to the free Pollinations image service to draw the picture. Leave it off if you prefer.`],[`Your Canva`,`If you connect your own Canva account, we store an encrypted access token so we can send designs you choose to your Canva. You can disconnect at any time.`],[`Who can see your videos`,`Your practice and Studio videos are seen only by you and Marketcraft administrators. In the Showcase, a video stays private unless you choose "Community"; it is then shown to other signed-in learners only after an administrator approves it. Videos are never shown to the public internet.`],[`Children`,`Anyone under 18 may only use Marketcraft through a parent's or guardian's own account; we store only the child's first name for certificates. A parent or guardian can ask us to view or delete their child's data at any time.`],[`Junior medal addresses`,`If a junior's Showcase video reaches 1,000 views, a parent or guardian can ask us to post a free medal. Only then do we ask for a postal address. It is entered by the parent, seen only by the Marketcraft administrator, used only to post the medal, and deleted as soon as the medal is sent (or the request is declined). Views are counted once per signed-in Marketcraft member; we store which members viewed a video only to count unique views.`],[`Ideas, streaks and swipe lessons`,`Your Idea Board / Business Canvas, pictures you add to it, your daily streak and which lessons you have swiped through are private to you (administrators can see them only to run the service). "Read to me" uses your own browser's built-in voice, so no text is sent anywhere.`],[`Ambassador Program`,`If you join the Ambassador Program, we store your referral code and the drafts you create with the AI marketing tools (your 30 most recent). The program is for account holders 18+ (kids only through a parent's account). Your Marketcraft login also works as a normal user account on our partner website, which has its own privacy policy.`],[`Your choices`,`You can ask for a copy of your data or for your account to be deleted by contacting the site administrator.`]]},terms:{title:`Terms of Use`,body:[[`Draft notice`,`${rs} is currently a school project. These terms are a working draft.`],[`Using the academy`,`Use Marketcraft to learn and practice marketing. Be respectful, and only upload videos you made or have permission to use.`],[`Your content`,`You keep ownership of the videos and writing you submit. You allow us to store and process them to provide feedback and certificates.`],[`AI feedback`,`Scores and feedback are generated automatically for learning purposes and may not be perfect.`],[`Certificates`,`Certificates recognize completion of a practice challenge. They are not an accredited qualification.`],[`Accounts`,`Keep your login private. Anyone under 18 must use a parent's or guardian's account under their supervision. Adult accounts confirm they are 18 or older. We may suspend accounts that misuse the service.`],[`Brand ambassadors`,`Ambassadors must follow the ambassador guidelines: be honest, clearly disclose the relationship in every post, never invent claims, and never spam. Breaking them can end your ambassador status.`]]}};function Os({kind:e}){ss();let t=Ds[e];return(0,_.useEffect)(()=>(document.title=`${t.title} · ${rs}`,()=>{document.title=rs}),[t.title]),(0,W.jsxs)(`div`,{className:`page-shell`,children:[(0,W.jsx)(ds,{}),(0,W.jsx)(`main`,{className:`container`,style:{maxWidth:760,padding:`20px 0 60px`},children:(0,W.jsxs)(`article`,{className:`card prose`,children:[(0,W.jsx)(`h1`,{children:t.title}),(0,W.jsxs)(`p`,{className:`muted smal
